name: "⚡ Quick Deploy (Emergency — Tests Skipped)"

# MANUAL TRIGGER ONLY — never runs on push.
# Use only when a critical fix must ship immediately.
# Go to Actions → "⚡ Quick Deploy (Emergency — Tests Skipped)" → Run workflow →
# branch master, pick the target. One build goes to every chosen server,
# test first. (v2 has its own copy of this workflow on the v2 branch.)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm emergency deploy (tests will be skipped)'
        required: true
        default: ""
      target:
        description: "Where to deploy"
        required: true
        default: both
        type: choice
        options:
          - both
          - test
          - production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Abort if not confirmed
        if: ${{ github.event.inputs.confirm != 'yes' }}
        run: |
          echo "ERROR: You must type exactly 'yes' to confirm. Got: '${{ github.event.inputs.confirm }}'"
          exit 1

      - name: Abort if not master
        if: ${{ github.ref_name != 'master' }}
        run: |
          echo "ERROR: Branch '${{ github.ref_name }}' is not supported. Use master."
          exit 1

      - name: Show emergency warning
        run: |
          echo "╔══════════════════════════════════════════════════════════════════════╗"
          echo "║  ⚠  EMERGENCY QUICK DEPLOY — TESTS SKIPPED — ${{ github.ref_name }} → ${{ github.event.inputs.target }}"
          echo "╚══════════════════════════════════════════════════════════════════════╝"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod tidy

      # ── Build only — no tests ──────────────────────────────────────────────────
      - name: Build (no tests)
        run: |
          BUILD_LOG=$(mktemp)
          if ! GOOS=linux GOARCH=amd64 go build \
                -ldflags="-X 'main.version=${{ github.sha }}'" \
                -o pos-rest . 2>"$BUILD_LOG"; then
            cat "$BUILD_LOG"
            echo "Build FAILED — aborting."
            exit 1
          fi
          if [ -s "$BUILD_LOG" ]; then
            cat "$BUILD_LOG"
            echo "Build produced warnings — aborting."
            exit 1
          fi
          sha256sum ./pos-rest | tee pos-rest.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: api-quick-release
          path: |
            pos-rest
            pos-rest.sha256
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Test before production; a failed test deploy stops production.
      max-parallel: 1
      fail-fast: true
      matrix:
        include:
          - target: test
            dest_secret: AWS_GO_API_TEST_DEST_PATH
            service: start-api-test
            port: 2002
            label: TEST
          - target: production
            dest_secret: AWS_GO_API_PROD_DEST_PATH
            service: start-api
            port: 2000
            label: PRODUCTION

    steps:
      - name: Skip targets that were not chosen
        id: chosen
        run: |
          WANT="${{ github.event.inputs.target }}"
          if [ "$WANT" = both ] || [ "$WANT" = "${{ matrix.target }}" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.label }} not chosen — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code (deploy scripts)
        if: steps.chosen.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: Download the build
        if: steps.chosen.outputs.go == 'true'
        uses: actions/download-artifact@v4
        with:
          name: api-quick-release

      - name: Set up SSH
        if: steps.chosen.outputs.go == 'true'
        run: |
          chmod 755 pos-rest
          sha256sum -c pos-rest.sha256
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare destination directory
        if: steps.chosen.outputs.go == 'true'
        run: |
          DEST_PATH="${{ secrets[matrix.dest_secret] }}"
          ssh -i private_key -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "sudo mkdir -p ${DEST_PATH} && sudo chown -R ${{ secrets.AWS_USER }}:${{ secrets.AWS_USER }} ${DEST_PATH}"

      - name: Upload binary to staging path
        if: steps.chosen.outputs.go == 'true'
        run: |
          DEST_PATH="${{ secrets[matrix.dest_secret] }}"
          scp -i private_key -o StrictHostKeyChecking=no \
            pos-rest \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${DEST_PATH}/pos-rest.new

      - name: Verify remote checksum
        if: steps.chosen.outputs.go == 'true'
        run: |
          DEST_PATH="${{ secrets[matrix.dest_secret] }}"
          LOCAL_SUM=$(awk '{print $1}' pos-rest.sha256)
          REMOTE_SUM=$(ssh -i private_key -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "sha256sum ${DEST_PATH}/pos-rest.new | awk '{print \$1}'")
          if [ "$LOCAL_SUM" != "$REMOTE_SUM" ]; then
            echo "Checksum MISMATCH — aborting."
            exit 1
          fi
          echo "Checksum verified: $LOCAL_SUM"

      # Graceful, health-checked restart with automatic rollback (see deploy/remote_restart.sh).
      # Service/port pairs: start-api-test 2002, start-api 2000.
      - name: Swap binary and restart service
        if: steps.chosen.outputs.go == 'true'
        run: |
          DEST_PATH="${{ secrets[matrix.dest_secret] }}"
          ssh -i private_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "bash -s -- '${DEST_PATH}' ${{ matrix.service }} ${{ matrix.port }}" \
            < deploy/remote_restart.sh
          echo "[${{ matrix.label }}] Quick deploy complete. Run full deploy.sh when stable."
