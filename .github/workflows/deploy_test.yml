name: Build and Deploy Go Application to test

on:
  push:
    branches:
      - test
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"
      - "e2e/**"
      - "deploy/**"
      - ".github/workflows/deploy_test.yml"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

# One deploy at a time per environment; a newer push waits instead of racing.
concurrency:
  group: deploy-api-test
  cancel-in-progress: false

jobs:
  # Unit, API, integration (MongoDB + Redis), API e2e and UI e2e suites.
  # Nothing below runs unless every one of them passes.
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      frontend_ref: test

  build-and-deploy:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Clean Go cache
        run: go clean -cache -modcache -i -r

      - name: Clean build directory
        run: rm -rf ./bin ./build ./pos-rest

      - name: Install dependencies
        run: go mod tidy

      # ── Build — abort if go build produces any output (warnings = abort) ──────
      - name: Build
        run: |
          BUILD_LOG=$(mktemp)
          if ! GOOS=linux GOARCH=amd64 go build \
                -ldflags="-X 'main.version=${{ github.sha }}'" \
                -o pos-rest . 2>"$BUILD_LOG"; then
            cat "$BUILD_LOG"
            echo "Build FAILED — aborting."
            exit 1
          fi
          if [ -s "$BUILD_LOG" ]; then
            cat "$BUILD_LOG"
            echo "Build produced warnings — aborting (matches deploy.sh gate)."
            exit 1
          fi
          sha256sum ./pos-rest

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      # ── Upload binary while service is still live (no downtime during transfer) ──
      - name: Upload binary to staging path
        run: |
          scp -i private_key -o StrictHostKeyChecking=no \
            pos-rest \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${{ secrets.AWS_GO_API_TEST_DEST_PATH }}/pos-rest.new

      # ── Verify checksum before touching the running service ───────────────────
      - name: Verify remote checksum
        run: |
          LOCAL_SUM=$(sha256sum ./pos-rest | awk '{print $1}')
          REMOTE_SUM=$(ssh -i private_key -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "sha256sum ${{ secrets.AWS_GO_API_TEST_DEST_PATH }}/pos-rest.new | awk '{print \$1}'")
          if [ "$LOCAL_SUM" != "$REMOTE_SUM" ]; then
            echo "Checksum MISMATCH — upload was corrupted. Aborting."
            echo "  local : $LOCAL_SUM"
            echo "  remote: $REMOTE_SUM"
            exit 1
          fi
          echo "Checksum verified: $LOCAL_SUM"

      # ── Graceful restart: no kill, health-checked, automatic rollback ────────
      # deploy/remote_restart.sh renames the new binary in while the old one
      # keeps serving, runs `systemctl restart` (the API drains in-flight
      # requests on SIGTERM; the new one binds its port before connecting to
      # MongoDB so requests queue instead of failing), waits for /v1/health
      # and puts the previous binary back if the new build is unhealthy.
      - name: Swap binary and restart service
        run: |
          ssh -i private_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "bash -s -- '${{ secrets.AWS_GO_API_TEST_DEST_PATH }}' start-api-test 2002" \
            < deploy/remote_restart.sh
