name: Tests

# Every test suite for the API. deploy_test.yml and deploy_prod.yml call this
# workflow and only deploy when all of its jobs pass. It can also be run by
# hand from the Actions tab against any branch.
on:
  workflow_call:
    inputs:
      frontend_ref:
        description: "sirinibin/reactjs-pos branch whose UI e2e suite runs against this API"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "sirinibin/reactjs-pos branch whose UI e2e suite runs against this API"
        required: true
        default: master
        type: string

env:
  E2E_EMAIL: e2e-admin@startpos.test
  E2E_PASSWORD: E2e-Passw0rd!
  MONGO_DB: pos_e2e
  REDIS_DSN: localhost:6379

jobs:
  # ── Unit + API handler tests (httptest, no database) ──────────────────────
  unit-and-api:
    name: Unit and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod tidy

      # Skip the timezone test that is flaky near midnight UTC (matches deploy.sh).
      - name: Run unit and API tests
        run: go test ./... -count=1 -skip "TestResolveDateKeyword_TimezoneOffset_SA"

  # ── Integration tests: models against real MongoDB + Redis ───────────────
  integration:
    name: Integration tests (MongoDB + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod tidy

      # A local S3-compatible server, so the S3 upload/read/delete code is
      # tested with real request signing. Throwaway keys; no real bucket.
      - name: Start a local S3 server (SeaweedFS)
        run: |
          mkdir -p /tmp/s3cfg
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"ciaccesskey","secretKey":"cisecretkey123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3cfg/s3.json
          docker run -d --network host --name s3 -v /tmp/s3cfg:/cfg chrislusf/seaweedfs:3.97 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/cfg/s3.json -master.volumeSizeLimitMB=64
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/)" = 403 ] && exit 0
            sleep 2
          done
          docker logs s3 | tail -20; exit 1

      # TestHealthCheck_ServicesDown asserts the health check reports MongoDB and
      # Redis as down, so it only holds without them; the unit job runs it.
      - name: Run integration tests
        env:
          MONGO_DB: startpos_integration_test
          S3_TEST_ENDPOINT: http://localhost:8333
          S3_TEST_ACCESS_KEY: ciaccesskey
          S3_TEST_SECRET_KEY: cisecretkey123
        run: go test -tags integration ./... -count=1 -skip "TestResolveDateKeyword_TimezoneOffset_SA|TestHealthCheck_ServicesDown"

  # ── API end-to-end: the built server over real HTTP ──────────────────────
  api-e2e:
    name: API end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod tidy

      - name: Build server
        run: go build -o pos-rest .

      - name: Seed e2e user
        run: go run ./e2e/seed

      - name: Start server
        run: |
          API_PORT=2000 nohup ./pos-rest > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:2000/v1/me && exit 0
            sleep 1
          done
          echo "Server did not start:"; cat server.log; exit 1

      - name: Run API e2e tests
        run: go test -tags e2e ./e2e/... -count=1 -v

      - name: Server log
        if: failure()
        run: tail -n 300 server.log

  # ── Race detector against real MongoDB + Redis ───────────────────────────
  race-db:
    name: Race detector (MongoDB + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dependencies
        run: go mod tidy

      # Blocking: every package's tests (unit + DB integration) are race-free.
      - name: Unit and integration tests with -race
        env:
          MONGO_DB: startpos_race_test
        run: go test -race -tags integration ./... -count=1 -skip "TestResolveDateKeyword_TimezoneOffset_SA|TestHealthCheck_ServicesDown"

      # The API e2e suite against a -race build of the server, so races in the
      # handlers and their background goroutines show up under real traffic.
      - name: Build race-enabled server and seed e2e user
        run: |
          go build -race -o pos-rest-race .
          go run ./e2e/seed

      - name: Start race-enabled server
        run: |
          API_PORT=2000 GORACE="halt_on_error=0" nohup ./pos-rest-race > server.log 2>&1 &
          for i in $(seq 1 90); do
            curl -s -o /dev/null http://localhost:2000/v1/me && exit 0
            sleep 1
          done
          echo "Server did not start:"; cat server.log; exit 1

      - name: Run API e2e tests against the race-enabled server
        env:
          POS_REST_BIN: ${{ github.workspace }}/pos-rest-race
        run: go test -race -tags e2e ./e2e/... -count=1

      # Report only for now: the request user is kept in package globals
      # (models.UserObject / TokenClaimsObject), which races whenever two
      # requests arrive together. Make this blocking once that is fixed.
      - name: Data races seen by the server (report only)
        if: always()
        continue-on-error: true
        run: |
          sleep 5
          RACES=$(grep -c "WARNING: DATA RACE" server.log || true)
          echo "### Server data races: ${RACES}" >> "$GITHUB_STEP_SUMMARY"
          grep -A 40 "WARNING: DATA RACE" server.log | grep -E "pos-rest/|^(Write|Read|Previous)" | sort | uniq -c | sort -rn | head -40 || true
          [ "${RACES}" = "0" ]

  # ── ZATCA Phase 2 against ZATCA's sandbox (developer portal) ─────────────
  # Onboards a new non-production store (ZATCA's test VAT 399999999900003,
  # CRN 4030360927) and reports simplified and standard invoices and a credit
  # note. Report only: an outage of ZATCA's sandbox must not block deploys.
  zatca-sandbox:
    name: ZATCA sandbox (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out the frontend
        uses: actions/checkout@v4
        with:
          repository: sirinibin/reactjs-pos
          ref: ${{ inputs.frontend_ref }}
          path: frontend

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Fatoora SDK (invoice signing) is a Java jar.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: 17.9.0

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm install
          NODE_OPTIONS="--openssl-legacy-provider --max-old-space-size=4096" \
          GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true \
          npm run build

      - name: Install dependencies
        run: |
          go mod tidy
          python -m venv ZatcaPython/venv
          ZatcaPython/venv/bin/pip install --quiet pyopenssl asn1crypto cryptography lxml pytz requests

      - name: Build server and seed e2e user
        run: |
          go build -o pos-rest .
          go run ./e2e/seed

      - name: Start server
        run: |
          API_PORT=2000 STATIC_DIR="$GITHUB_WORKSPACE/frontend/build" nohup ./pos-rest > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:2000/v1/me && exit 0
            sleep 1
          done
          echo "Server did not start:"; cat server.log; exit 1

      - name: Run ZATCA sandbox tests
        run: go test -tags "e2e zatca" ./e2e/api -run TestZatcaSandbox -count=1 -v 2>&1 | tee zatca.log; exit ${PIPESTATUS[0]}
        shell: bash

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 20

      # The frontend's ZATCA flow in Chromium: onboard a new test store
      # (VAT 399999999900003), report a simplified invoice, clear a standard
      # invoice and report a credit note through the UI.
      - name: Run the frontend's ZATCA sandbox tests
        if: always()
        working-directory: frontend/e2e
        shell: bash
        env:
          CI: "true"
          E2E_ZATCA: "1"
          E2E_ZATCA_OTP: "123345"
        run: |
          if [ ! -f fullstack/zatca.spec.js ]; then
            echo "::notice title=ZATCA sandbox (UI)::fullstack/zatca.spec.js is not on this frontend branch yet"
            exit 0
          fi
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.fullstack.config.js fullstack/zatca.spec.js --project=desktop 2>&1 | tee ../../zatca-ui.log; exit ${PIPESTATUS[0]}

      # The job log ends with the service containers' output, which can push
      # the test output past what the log API returns; annotations keep it.
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          grep -E -- '--- FAIL|_test.go:[0-9]+:' zatca.log | head -20 | while IFS= read -r l; do echo "::error title=ZATCA sandbox::${l}"; done
          [ -f zatca-ui.log ] && grep -E '✘|Error:|expect\(' zatca-ui.log | head -20 | while IFS= read -r l; do echo "::error title=ZATCA sandbox (UI)::${l:0:900}"; done
          grep -iE 'zatca|python|error' server.log | tail -10 | while IFS= read -r l; do echo "::warning title=ZATCA server log::${l:0:900}"; done

      - name: Server log
        if: failure()
        run: tail -n 300 server.log

  # ── UI end-to-end: the React app in Chromium against this API ────────────
  ui-e2e:
    name: UI end-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Check out the frontend
        uses: actions/checkout@v4
        with:
          repository: sirinibin/reactjs-pos
          ref: ${{ inputs.frontend_ref }}
          path: frontend

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Go dependencies
        run: go mod tidy

      - uses: actions/setup-node@v4
        with:
          node-version: 17.9.0

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm install
          NODE_OPTIONS="--openssl-legacy-provider --max-old-space-size=4096" \
          GENERATE_SOURCEMAP=false DISABLE_ESLINT_PLUGIN=true \
          npm run build

      - name: Build server and seed e2e user
        run: |
          go build -o pos-rest .
          go run ./e2e/seed

      - name: Start server (serving the frontend build)
        run: |
          API_PORT=2000 STATIC_DIR="$GITHUB_WORKSPACE/frontend/build" nohup ./pos-rest > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:2000/v1/me && exit 0
            sleep 1
          done
          echo "Server did not start:"; cat server.log; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run UI e2e tests
        working-directory: frontend/e2e
        env:
          CI: "true"
        run: npx playwright test -c playwright.fullstack.config.js

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: |
            frontend/e2e/playwright-report-fullstack
            frontend/e2e/test-results-fullstack
          retention-days: 14

      - name: Server log
        if: failure()
        run: tail -n 300 server.log
