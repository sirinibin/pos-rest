name: Build and Deploy Go Application to v2 (startpos-api-v2.gulfunionozone.com)

on:
  push:
    branches:
      - v2
    paths:
      - "**.go"
      - "**.mod"
      - "**.sum"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.23"

      - name: Clean Go cache
        run: go clean -cache -modcache -i -r

      - name: Clean build directory
        run: rm -rf ./bin ./build ./pos-rest

      - name: Install dependencies
        run: go mod tidy

      # ── Tests — skip flaky timezone test (matches deploy_v2.sh) ──────────────
      - name: Run tests
        run: go test ./... -count=1 -skip "TestResolveDateKeyword_TimezoneOffset_SA"

      # ── Build — abort if go build produces any output (warnings = abort) ──────
      - name: Build
        run: |
          BUILD_LOG=$(mktemp)
          if ! GOOS=linux GOARCH=amd64 go build \
                -ldflags="-X 'main.version=${{ github.sha }}'" \
                -o pos-rest . 2>"$BUILD_LOG"; then
            cat "$BUILD_LOG"
            echo "Build FAILED — aborting."
            exit 1
          fi
          if [ -s "$BUILD_LOG" ]; then
            cat "$BUILD_LOG"
            echo "Build produced warnings — aborting (matches deploy_v2.sh gate)."
            exit 1
          fi
          sha256sum ./pos-rest

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key
          chmod 600 private_key
          ssh-keyscan -H ${{ secrets.AWS_HOST }} >> ~/.ssh/known_hosts

      # ── Ensure dest dir exists and is writable by ubuntu ─────────────────────
      - name: Prepare destination directory
        run: |
          ssh -i private_key -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "sudo mkdir -p ${{ secrets.AWS_GO_API_V2_DEST_PATH }} && sudo chown -R ${{ secrets.AWS_USER }}:${{ secrets.AWS_USER }} ${{ secrets.AWS_GO_API_V2_DEST_PATH }}"

      # ── Upload binary while service is still live (no downtime during transfer) ──
      - name: Upload binary to staging path
        run: |
          scp -i private_key -o StrictHostKeyChecking=no \
            pos-rest \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}:${{ secrets.AWS_GO_API_V2_DEST_PATH }}/pos-rest.new

      # ── Verify checksum before touching the running service ───────────────────
      - name: Verify remote checksum
        run: |
          LOCAL_SUM=$(sha256sum ./pos-rest | awk '{print $1}')
          REMOTE_SUM=$(ssh -i private_key -o StrictHostKeyChecking=no \
            ${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }} \
            "sha256sum ${{ secrets.AWS_GO_API_V2_DEST_PATH }}/pos-rest.new | awk '{print \$1}'")
          if [ "$LOCAL_SUM" != "$REMOTE_SUM" ]; then
            echo "Checksum MISMATCH — upload was corrupted. Aborting."
            echo "  local : $LOCAL_SUM"
            echo "  remote: $REMOTE_SUM"
            exit 1
          fi
          echo "Checksum verified: $LOCAL_SUM"

      # ── Atomic swap + service restart (downtime = systemd restart time, ~1 s) ──
      # No time-window restriction — v2 deploys any time a push lands on the branch.
      - name: Swap binary and restart service
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEST="${{ secrets.AWS_GO_API_V2_DEST_PATH }}"

            # Kill any stale file handle that would cause ETXTBSY on swap
            sudo fuser -k "$DEST/pos-rest"     2>/dev/null || true
            sudo fuser -k "$DEST/pos-rest.new" 2>/dev/null || true

            # Stop → swap → sync  (service is down for the duration of this line only)
            sudo systemctl stop start-api-v2 || true
            mv -f "$DEST/pos-rest.new" "$DEST/pos-rest"
            sync

            # Start with up to 3 retries
            for attempt in 1 2 3; do
              sudo systemctl start start-api-v2 && break
              echo "Start attempt $attempt/3 failed, retrying in 5 s..."
              sleep 5
            done

            sudo systemctl is-active start-api-v2
            sha256sum "$DEST/pos-rest"
            sudo systemctl status start-api-v2 --no-pager
